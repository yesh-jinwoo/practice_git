<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Security Registration</title>
</head>

<body>

    <header>
        <h1>AI Security Academy</h1>

        <nav>
            <a href="#about">About</a>
            <a href="#register">Register</a>
        </nav>
    </header>

    <main>

        <section id="about">

            <h2>Welcome to AI Security</h2>
                <br><br>

                <label for="role">
                    Select Your Interest
                </label>

                <select id="role" name="role">

                    <option value="ai">AI Engineering</option>
                    <option value="security">Cybersecurity</option>
                    <option value="fullstack">Full Stack Development</option>

                </select>

                <br><br>

                <label>
                    <input
                        type="checkbox"
                        name="terms"
                        required
                    >
                    I accept the terms and conditions.
                </label>

                <br><br>

                <button type="submit">
                    Create Account
                </button>

            </form>

        </section>
        

    </main>

    <footer>
        <p>© 2026 AI Security Academy</p>
    </footer>

</body>
</html>
            <p>
                Learn Artificial Intelligence,
                Cybersecurity and Full Stack Development.
            </p>

        </section>

        <section id="register">

            <h2>Create Your Account</h2>

            <form action="/register" method="POST">

                <label for="fullname">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required
                >

                <br><br>

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <br><br>

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    required
                >

                <br><br>

                <label for="role">
                    Select Your Interest
                </label>

                <select id="role" name="role">

                    <option value="ai">AI Engineering</option>
                    <option value="security">Cybersecurity</option>
                    <option value="fullstack">Full Stack Development</option>

                </select>

                <br><br>

                <label>
                    <input
                        type="checkbox"
                        name="terms"
                        required
                    >
                    I accept the terms and conditions.
                </label>

                <br><br>

                <button type="submit">
                    Create Account
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 AI Security Academy</p>
    </footer>

</body>
</html>
